<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Бронирование — IndexDrive</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="header">
        <nav class="navbar navbar-expand-lg navbar-light container">
            <a class="navbar-brand" href="index.html">Index <span>Drive</span></a>

            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#nav"
                aria-label="Меню">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="branches.html">Филиалы</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="vehicles.html">Автомобили</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-primary" href="login.html">Личный кабинет</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container content form-block">
        <div class="row">
            <div class="col-lg-10">
                <p class="subtitle">Новая поездка</p>
                <h1>Бронирование автомобиля</h1>
                <p class="form-text">Данные об автомобиле</p>

                <div>
                    <!-- данные об автомобиле -->
                    <section class="form-part">
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="car">Марка и модель автомобиля</label>
                                <select class="form-control" id="car">
                                    <option value="">Выберите автомобиль</option>
                                    <option>Комфортный седан</option>
                                    <option>Семейный кроссовер</option>
                                    <option>Городское купе</option>
                                </select>
                            </div>

                            <div class="form-group col-md-6">
                                <label for="branch">Филиал</label>
                                <select class="form-control" id="branch">
                                    <option value="">Выберите филиал</option>
                                    <option>Москва — Центр</option>
                                    <option>Санкт-Петербург</option>
                                    <option>Казань — Аэропорт</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="pickup">Дата бронирования</label>
                                <input class="form-control" type="date" id="pickup">
                            </div>

                            <div class="form-group col-md-6">
                                <label for="return">Дата возврата</label>
                                <input class="form-control" type="date" id="return">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="price">Стоимость бронирования за день</label>
                            <input class="form-control" id="price" disabled
                                placeholder="Определяется выбранным автомобилем">
                        </div>
                    </section>

                    <!-- данные о клиенте -->
                    <section class="form-part">
                        <h2>Данные о клиенте</h2>

                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="last">Фамилия</label>
                                <input class="form-control" id="last">
                            </div>

                            <div class="form-group col-md-6">
                                <label for="first">Имя</label>
                                <input class="form-control" id="first">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="middle">Отчество</label>
                                <input class="form-control" id="middle">
                            </div>

                            <div class="form-group col-md-6">
                                <label for="phone">Номер телефона</label>
                                <input class="form-control" type="tel" id="phone">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="passport">Паспортные данные</label>
                                <input class="form-control" id="passport">
                            </div>

                            <div class="form-group col-md-6">
                                <label for="card">Банковская карта</label>
                                <input class="form-control" id="card" placeholder="Оплата в пункте проката">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="birth">Дата рождения</label>
                            <input class="form-control" type="date" id="birth">
                        </div>
                    </section>

                    <a class="btn btn-primary mt-2" href="account.html">Забронировать</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-top">
            <div>
                <a class="footer-name" href="index.html">IndexDrive</a>
                <p>Телефон: 8 (800) 555-35-35</p>
            </div>

            <nav class="footer-menu">
                <a href="history.html">История</a>
                <a href="branches.html">Филиалы</a>
                <a href="vehicles.html">Автомобили</a>
                <a href="login.html">Вход</a>
                <a href="register.html">Регистрация</a>
                <a href="booking.html">Бронирование</a>
            </nav>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
